name: Quarto CI/CD

# Trigger the workflow on pushes and PRs to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required permissions for deploying to GitHub Pages securely via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Quarto version used to build the deck; keep in sync with .gitlab-ci.yml
env:
  QUARTO_VERSION: "1.9.38"

# Ensure only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --- JOB 1: Test the build on Pull Requests ---
  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
          
      - name: Test Quarto Build
        run: |
          echo "Testing Quarto build..."
          quarto render index.qmd
          echo "✅ Build successful! Safe to merge."

  # --- JOB 2: Deploy to Pages from the main branch ---
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
          
      - name: Render Production Presentation
        run: |
          echo "Rendering production presentation..."
          quarto render index.qmd
        
      - name: Prepare Public Directory
        run: |
          mkdir -p public
          mv index.html public/
          mv index_files/ public/
          mv assets/ public/
          mv style.css public/
          echo "✅ Deployment package ready!"
          
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
