name: Quarto CI/CD

# Trigger the workflow on pushes and PRs to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required permissions for deploying to GitHub Pages securely via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --- JOB 1: Test the build on Pull Requests ---
  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          sudo apt-get update && sudo apt-get install -y curl wget
          LATEST_URL=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | grep "browser_download_url.*linux-amd64.deb" | cut -d '"' -f 4)
          wget $LATEST_URL -O quarto-latest.deb
          sudo apt-get install ./quarto-latest.deb -y
          
      - name: Test Quarto Build
        run: |
          echo "Testing Quarto build..."
          quarto render index.qmd
          echo "✅ Build successful! Safe to merge."

  # --- JOB 2: Deploy to Pages from the main branch ---
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          sudo apt-get update && sudo apt-get install -y curl wget
          LATEST_URL=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | grep "browser_download_url.*linux-amd64.deb" | cut -d '"' -f 4)
          wget $LATEST_URL -O quarto-latest.deb
          sudo apt-get install ./quarto-latest.deb -y
          
      - name: Render Production Presentation
        run: |
          echo "Rendering production presentation..."
          quarto render index.qmd
        
      - name: Prepare Public Directory
        run: |
          mkdir public
          mv index.html public/
          mv index_files/ public/
          mv assets/ public/
          mv style.css public/
          echo "✅ Deployment package ready!"
          
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4