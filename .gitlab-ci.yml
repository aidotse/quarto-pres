# Same checks and deploy as .github/workflows/quarto-pages.yml; keep in sync.

# Quarto version used to build the deck; keep in sync with .github/workflows/quarto-pages.yml
variables:
  QUARTO_VERSION: "1.9.38"

# Official Quarto image (Ubuntu 22.04 with Quarto preinstalled)
image: ghcr.io/quarto-dev/quarto:${QUARTO_VERSION}

# Define our stages
stages:
  - test
  - deploy

# --- JOB 1: Render both builds on every Merge Request ---
test-build:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - quarto render index.qmd --profile standalone
    - mkdir -p standalone && mv index.html standalone/
    - quarto render index.qmd
    # Assemble public/ exactly as the pages job does
    - mkdir -p public && cp -r index.html index_files/ assets/ style.css public/
  artifacts:
    paths:
      - public/
      - standalone/
    expire_in: 14 days

# --- JOB 2: Visit every slide with the network blocked ---
# Fails on JavaScript errors and on files missing from the deployed set.
smoke-test:
  stage: test
  image: node:22
  needs: [ test-build ]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - (cd tools && npm ci && npx playwright install --with-deps chromium)
    - node tools/shot.mjs --html public/index.html --offline --frags none --wait 300 --size 1920x1080,820x1180 --out shots/lean
    - node tools/shot.mjs --html standalone/index.html --offline --frags none --wait 300 --out shots/standalone
  artifacts:
    when: always
    paths:
      - shots/
    expire_in: 14 days

# --- JOB 3: Deploy to Pages from the main branch ---
pages:
  stage: deploy
  rules:
    # Pushes to main, and pipelines run manually on main
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "Rendering production presentation..."
    - quarto render index.qmd

    - mkdir public
    - mv index.html public/
    - mv index_files/ public/
    - mv assets/ public/
    - mv style.css public/

    - echo "✅ Deployment package ready!"
  artifacts:
    paths:
      - public
